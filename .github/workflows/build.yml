name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore TimeReport.slnx --locked-mode
      - name: Build
        run: dotnet build TimeReport.slnx -c Release --no-restore
      - name: Test with coverage
        run: |
          dotnet test TimeReport.slnx -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults
      - name: Check vulnerable packages
        run: |
          dotnet list src/TimeReport/TimeReport.csproj package --vulnerable --include-transitive
          dotnet list tests/TimeReport.Tests/TimeReport.Tests.csproj package --vulnerable --include-transitive
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
      - name: Format check
        run: dotnet format TimeReport.slnx --verify-no-changes --no-restore
      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libxrandr2 libxi6 libxcursor1 libxext6 \
            libxrender1 libfontconfig1 libice6 libsm6 libxfixes3 libxinerama1 \
            libxcomposite1 libxdamage1 libxcb-randr0 libxcb-render0 libxcb-shm0 \
            libxcb-image0 libxcb-util1
      - name: GUI smoke test
        run: |
          xvfb-run -a dotnet run --project src/TimeReport/TimeReport.csproj \
            -c Release --no-build -- --smoke-test --data-dir "$RUNNER_TEMP/timereport-test"

  test-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore TimeReport.slnx --locked-mode
      - name: Build
        run: dotnet build TimeReport.slnx -c Release --no-restore
      - name: Test
        run: dotnet test TimeReport.slnx -c Release --no-build
      - name: Check vulnerable packages
        run: |
          dotnet list src/TimeReport/TimeReport.csproj package --vulnerable --include-transitive
          dotnet list tests/TimeReport.Tests/TimeReport.Tests.csproj package --vulnerable --include-transitive
      - name: Format check
        run: dotnet format TimeReport.slnx --verify-no-changes --no-restore
      - name: GUI smoke test
        shell: pwsh
        run: |
          dotnet run --project src/TimeReport/TimeReport.csproj -c Release --no-build -- `
            --smoke-test --data-dir "$env:RUNNER_TEMP\timereport-test"

  build-linux:
    needs: test-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore TimeReport.slnx --locked-mode
      - name: Publish Linux executable
        run: |
          dotnet publish src/TimeReport/TimeReport.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:BuildNumber=${{ github.run_number }} \
            -p:BuildCommit=${{ github.sha }} \
            --no-restore \
            -o dist/linux
      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libxrandr2 libxi6 libxcursor1 libxext6 \
            libxrender1 libfontconfig1 libice6 libsm6 libxfixes3 libxinerama1 \
            libxcomposite1 libxdamage1 libxcb-randr0 libxcb-render0 libxcb-shm0 \
            libxcb-image0 libxcb-util1
      - name: Smoke test executable
        run: |
          xvfb-run -a dist/linux/TimeReport --smoke-test \
            --data-dir "$RUNNER_TEMP/timereport-binary-test"
      - name: Create checksum
        run: |
          cd dist/linux
          sha256sum TimeReport > TimeReport.sha256
      - name: Create packages
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TimeReport-linux-x86_64
          path: |
            dist/linux/TimeReport
            dist/linux/TimeReport.sha256
            dist/packages/*
          if-no-files-found: error

  build-windows:
    needs: test-windows
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore TimeReport.slnx --locked-mode
      - name: Publish Windows executable
        run: |
          dotnet publish src/TimeReport/TimeReport.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:BuildNumber=${{ github.run_number }} `
            -p:BuildCommit=${{ github.sha }} `
            --no-restore `
            -o dist/windows
      - name: Smoke test executable
        shell: pwsh
        run: |
          $arguments = @("--smoke-test", "--data-dir", "$env:RUNNER_TEMP\timereport-binary-test")
          $process = Start-Process -FilePath "dist\windows\TimeReport.exe" `
            -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\windows\TimeReport.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TimeReport.exe" | Set-Content "dist\windows\TimeReport.exe.sha256"
      - name: Create packages
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TimeReport-windows-x86_64
          path: |
            dist/windows/TimeReport.exe
            dist/windows/TimeReport.exe.sha256
            dist/packages/*
          if-no-files-found: error
