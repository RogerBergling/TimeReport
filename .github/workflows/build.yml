name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb
      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Run tests
        run: .venv/bin/python -m pytest -q
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Format check
        run: .venv/bin/ruff format --check .
      - name: GUI smoke test
        run: xvfb-run -a .venv/bin/python -m timereport --smoke-test --data-dir "$RUNNER_TEMP/timereport-test"

  test-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .

  build-linux:
    needs: test-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb
      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Build executable
        run: .venv/bin/python -m PyInstaller --clean --noconfirm packaging/timereport.spec
      - name: Smoke test executable
        run: xvfb-run -a dist/TimeReport --smoke-test --data-dir "$RUNNER_TEMP/timereport-binary-test"
      - uses: actions/upload-artifact@v4
        with:
          name: TimeReport-linux-x86_64
          path: dist/TimeReport
          if-no-files-found: error

  build-windows:
    needs: test-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm packaging/timereport.spec
      - name: Smoke test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\TimeReport.exe" -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: TimeReport-windows-x86_64
          path: dist/TimeReport.exe
          if-no-files-found: error
