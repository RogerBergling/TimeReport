name: Web image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test web application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.404"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore TimeReport.slnx --locked-mode
      - name: Build
        run: dotnet build TimeReport.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/TimeReport.Web.Tests/TimeReport.Web.Tests.csproj -c Release --no-build
      - name: Check vulnerable packages
        run: |
          dotnet list src/TimeReport.Web/TimeReport.Web.csproj package --vulnerable --include-transitive
          dotnet list src/TimeReport.Core/TimeReport.Core.csproj package --vulnerable --include-transitive
      - name: Format check
        run: dotnet format TimeReport.slnx --verify-no-changes --no-restore

  image:
    name: Build ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/rogerbergling/timereport-web
            demo: "false"
            title: TimeReport Web
          - image: ghcr.io/rogerbergling/timereport-web-demo
            demo: "true"
            title: TimeReport Web Demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=Multiuser TimeReport web application with TOTP and per-user SQLCipher databases
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_COMMIT=${{ github.sha }}
            DEMO_MODE=${{ matrix.demo }}
          cache-from: type=gha,scope=${{ matrix.demo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.demo }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Smoke test image
        run: |
          set -euo pipefail
          # Use the first metadata tag. For pull requests Buildx loads a single
          # image into the local Docker daemon.
          image="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"

          key="$(head -c 32 /dev/urandom | base64 -w0)"
          cleanup() {
            docker logs timereport-smoke 2>/dev/null || true
            docker rm -f timereport-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d --name timereport-smoke \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --tmpfs /data:rw,noexec,nosuid,size=64m,mode=1777 \
            -e TIMEREPORT_MASTER_KEY="$key" \
            -e TIMEREPORT_COOKIE_SECURE=false \
            -e TIMEREPORT_SETUP_TOKEN=smoke-test-token-1234567890 \
            -e TIMEREPORT_TRUSTED_PROXIES=127.0.0.1/32 \
            "$image"

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/readyz | grep -q '"ok":true'
          if [ "${{ matrix.demo }}" = "true" ]; then
            curl -fsS http://127.0.0.1:18080/login | grep -q 'Guest access'
            curl -fsS http://127.0.0.1:18080/demo/otp | grep -q '"code"'
          else
            curl -fsS http://127.0.0.1:18080/setup | grep -q 'Create the first administrator'
          fi
          test "$(docker exec timereport-smoke id -u)" = "10001"
          echo "Image smoke test passed: $image"
