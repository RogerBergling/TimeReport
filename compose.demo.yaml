services:
  timereport-demo:
    # Build with DEMO_MODE=true is published separately from the production
    # image. The guest password is public and the data is fake.
    image: ghcr.io/rogerbergling/timereport-web-demo:latest
    # To build locally instead, uncomment:
    # build:
    #   context: .
    #   args:
    #     DEMO_MODE: "true"
    container_name: timereport-demo
    restart: unless-stopped
    ports:
      - "${TIMEREPORT_DEMO_HTTP_BIND:-127.0.0.1}:${TIMEREPORT_DEMO_HTTP_PORT:-8081}:8080"
    environment:
      TIMEREPORT_DEMO_MODE: "true"
      TIMEREPORT_DEMO_RESET_HOURS: "${TIMEREPORT_DEMO_RESET_HOURS:-2}"
      TIMEREPORT_DATA_DIR: /data
      TIMEREPORT_COOKIE_SECURE: "true"
      TIMEREPORT_TRUSTED_PROXIES: "${TIMEREPORT_TRUSTED_PROXIES:-172.16.0.0/12}"
      TIMEREPORT_ALLOWED_HOSTS: "${TIMEREPORT_DEMO_ALLOWED_HOSTS:-*}"
      TZ: "${TZ:-UTC}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /data:rw,noexec,nosuid,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
